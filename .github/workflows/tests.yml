# Offline tests. No model is loaded, no engine is started, no secret is used,
# and the only network access is installing the pinned requirements.
#
# The macOS job is the gate. The Linux job runs the same files for
# information only (continue-on-error), to show which tests are not tied to
# macOS; it never makes a pull request red.
#
# Each test file runs in its own pytest process, as the README recommends:
# some imported tests reload modules or patch process-wide state.
#
# The files are discovered, not listed here: tools/ci_test_files.py prints
# every tracked tests/test_*.py and ios-bench/tools/test_*.py except the
# exclusions it names with their reasons, so a merged branch's new test
# files join the gate on their own. A file that collects no tests fails.

name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  macos:
    name: offline tests (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt
      - name: Install requirements
        run: python -m pip install -r requirements-dev.txt
      - name: Toolbench cases load and bind (no model)
        run: |
          python scripts/run_toolbench.py --list | tail -1
          python scripts/run_toolbench.py --dry-run | tail -1
      - name: Run the offline test files
        run: |
          files=$(python tools/ci_test_files.py --why) || exit 1
          echo "$(echo "$files" | wc -l | tr -d ' ') test files"
          status=0
          for f in $files; do
            echo "::group::$f"
            python -m pytest -q --no-header "$f" || status=1
            echo "::endgroup::"
          done
          exit $status

  linux:
    name: offline tests (Linux, informational)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt
      - name: Install requirements
        run: python -m pip install -r requirements-dev.txt
      - name: Run the offline test files, one result line per file
        run: |
          files=$(python tools/ci_test_files.py) || exit 1
          for f in $files; do
            line=$(python -m pytest -q --no-header "$f" 2>&1 | tail -1)
            echo "$f :: $line"
          done
