# Offline tests. No model is loaded, no engine is started, no secret is used,
# and the only network access is installing the pinned requirements and the
# pinned Node below.
#
# One job, on macOS (Apple silicon), is the gate: the benchmark targets Apple
# silicon only, so there is no Linux job. Only this job's result is evidence.
#
# Each test file runs in its own pytest process, as the README recommends:
# some imported tests reload modules or patch process-wide state.
#
# The files are discovered, not listed here: tools/ci_test_files.py prints
# every tracked tests/test_*.py and ios-bench/tools/test_*.py except the
# exclusions it names with their reasons, so a merged branch's new test
# files join the gate on their own. A file that collects no tests fails.

name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A pull request's runs share one group per branch, and a new push to the branch
# cancels its older run: only the newest head matters there. A push to main gets a
# group of its own (its commit), so it is never cancelled or replaced by the next
# push: every commit on main ends with a completed run. With one group per ref,
# cancel-in-progress off would not be enough, since a group keeps only one pending
# run and drops the others.
concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  macos:
    name: offline tests (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt
      - name: Install requirements
        run: python -m pip install -r requirements-dev.txt
      # The sidekick tests run model-written JavaScript inside a Seatbelt sandbox
      # that may read only the interpreter's own folder. The runner's Homebrew
      # Node loads libuv from /opt/homebrew/opt, so the sandbox (correctly)
      # stops it; the official Node build is self-contained.
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Point the sidekick tests at that Node
        run: |
          node_bin="$(command -v node)"
          echo "EDAT_SIDEKICK_NODE=$node_bin" >> "$GITHUB_ENV"
          echo "node: $node_bin $("$node_bin" --version)"
          otool -L "$node_bin" | sed 1d
      - name: Toolbench cases load and bind (no model)
        run: |
          python scripts/run_toolbench.py --list | tail -1
          python scripts/run_toolbench.py --dry-run | tail -1
      - name: Run the offline test files
        run: |
          files=$(python tools/ci_test_files.py --why) || exit 1
          echo "$(echo "$files" | wc -l | tr -d ' ') test files"
          status=0
          for f in $files; do
            echo "::group::$f"
            python -m pytest -q --no-header "$f" || status=1
            echo "::endgroup::"
          done
          exit $status
