# Offline tests. No model is loaded, no engine is started, no secret is used,
# and the only network access is installing the pinned requirements.
#
# The macOS job is the gate. The Linux job runs the same files for
# information only (continue-on-error), to show which tests are not tied to
# macOS; it never makes a pull request red.
#
# Each test file runs in its own pytest process, as the README recommends:
# some imported tests reload modules or patch process-wide state.

name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  # The 15 offline test files that pass on main. Named one by one: a bare
  # `pytest` also collects paths this repository does not have (air/tests).
  #
  # Left out on purpose (see IMPORT.md):
  # - tests/test_send_recipient_preflight.py: one test reads the Mac app's Swift
  #   source (app/), which is not imported.
  # - tests/test_local_provider_tools.py, test_power_tier.py,
  #   test_effect_refusal_no_lock.py, test_harbor_self_reference.py,
  #   test_long_email_digest.py, test_model_only_quality.py,
  #   test_model_led_integration.py, test_model_led_entrypoint.py: pass
  #   locally, but cover Harbor's backend rather than a benchmark harness;
  #   not yet part of the benchmark's gate.
  TEST_FILES: >-
    tests/test_toolbench.py
    tests/test_toolbench_world.py
    tests/test_rc3_toolbench_scorer.py
    tests/test_eval_planner_dry_run.py
    tests/test_sandbox_world.py
    tests/test_reply_bridge_simulation.py
    tests/test_backend_identity_and_sandbox_isolation.py
    tests/test_memory_eval_scorer.py
    tests/test_edat_results_aggregate.py
    tests/test_edat_results_convert.py
    tests/test_edat_results_export.py
    tests/test_edat_results_stats.py
    tests/test_edat_results_writer.py
    tests/test_bench_profiles.py
    tests/test_productbench.py

jobs:
  macos:
    name: offline tests (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt
      - name: Install requirements
        run: python -m pip install -r requirements-dev.txt
      - name: Toolbench cases load and bind (no model)
        run: |
          python scripts/run_toolbench.py --list | tail -1
          python scripts/run_toolbench.py --dry-run | tail -1
      - name: Run the offline test files
        run: |
          status=0
          for f in $TEST_FILES; do
            echo "::group::$f"
            python -m pytest -q --no-header "$f" || status=1
            echo "::endgroup::"
          done
          exit $status

  linux:
    name: offline tests (Linux, informational)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt
      - name: Install requirements
        run: python -m pip install -r requirements-dev.txt
      - name: Run the offline test files, one result line per file
        run: |
          for f in $TEST_FILES; do
            line=$(python -m pytest -q --no-header "$f" 2>&1 | tail -1)
            echo "$f :: $line"
          done
