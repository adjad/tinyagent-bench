# Compose override for a self-hosted Firecrawl capture (spec 15 §1.3).
#
# Firecrawl's own docker-compose.yaml publishes the API on every interface
# ("${PORT:-3002}:3002"), and its default API is unauthenticated. This file,
# written for tinyagent-bench, rebinds it to this machine only. Use it next to
# Firecrawl's compose file, from a checkout of a pinned Firecrawl release:
#
#   docker compose -f docker-compose.yaml -f <this file> up -d api
#
# `up -d api` starts the API and its dependencies (Playwright, Redis,
# RabbitMQ, NuQ PostgreSQL) and leaves out the optional FoundationDB services.
# Needs Docker Compose 2.24 or later for `!override`.
services:
  api:
    ports: !override
      - "127.0.0.1:${PORT:-3002}:${INTERNAL_PORT:-3002}"
