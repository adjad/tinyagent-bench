# Questions about Harbor itself (features #40-41, real-usage 1H #88-89 and #38, #67-68).
# They are answered from the harbor_admin tools, which are allowed in every access mode
# (dev8 4637f5b8; they were denied as 'unclassified (harbor_admin)' before). Harbor is never
# Siri, so every answer here also refuses to say so.
- id: harbor_tools_available
  prompt: "what tools are available to you"
  expect: [{tool: harbor_capabilities}]
  forbid: [run_shell, web_search]
  answer:
    contains_any: [calendar, reminders, mail]
    not_contains: ["Siri", "<|tool_call"]
  trap: "real-usage 1H #88 (a real turn): the capability inventory comes from harbor_capabilities, not from memory or the web"
- id: harbor_what_can_you_do_lc
  prompt: "what can u do"
  expect: [{tool: harbor_capabilities}]
  forbid: [run_shell, web_search]
  answer:
    contains_any: [calendar, reminders, mail, messages]
    not_contains: ["Siri", "<|tool_call"]
  trap: "features #41 / dev8 881b9810: a lowercase 'what can you do' is the general inventory (topic=overview)"
- id: harbor_who_are_you
  prompt: "so what exactly are you"
  expect: [{tool: harbor_capabilities}]
  forbid: [web_search]
  answer:
    contains_any: [Harbor]
    not_contains: ["Siri", "ChatGPT", "OpenAI", "<|tool_call"]
  trap: "features #41: identity answer (topic=identity); Harbor, running on this Mac"
- id: harbor_data_private
  prompt: "is my data private"
  expect: [{any_of: [harbor_capabilities, harbor_status]}]
  forbid: [web_search, run_shell]
  answer:
    contains_any: ["this Mac", "your Mac", "on-device", "locally", "local"]
    not_contains: ["Siri", "<|tool_call", "I don't know"]
  trap: "real-usage 1H #89: the model guessed; the answer is read from the privacy report (on this Mac, no cloud model) via harbor_capabilities(topic=privacy) or harbor_status"
- id: harbor_model_running
  prompt: "what model are you running"
  expect: [{tool: harbor_status}]
  forbid: [web_search, run_shell]
  answer:
    contains_any: [gemma]
    not_contains: ["Siri", "GPT", "Claude"]
  trap: "features #40: harbor_status(topic=models) names the loaded model; a model that answers from its own weights says GPT or Claude"
- id: harbor_email_last_sync
  prompt: "when did my email last sync"
  expect: [{tool: harbor_status, args: {topic: sync}}]
  forbid: [view_emails, summarize_emails, run_shell]
  answer: {contains_any: ["3m", "3 min", "3 minutes", "minutes ago"]}
  trap: "features #40: sync times come from harbor_status(topic=sync) (Mail 3m ago), not from reading the inbox and guessing from the newest message"
- id: harbor_skills_have
  prompt: "what skills do i have"
  expect: [{tool: harbor_skills}]
  forbid: [run_shell, search_notes, recall]
  answer: {contains_any: ["mac-controls", "mac controls", "idea-refine", "interview-me"]}
  trap: "features #40: installed skills are listed by harbor_skills; the bundled set is mac-controls, idea-refine and interview-me"
- id: harbor_mcp_working
  prompt: "is my mcp server working"
  expect: [{tool: harbor_mcp}]
  forbid: [run_shell, mcp_drive_create_document]
  answer: {contains_any: [drive, connected]}
  trap: "features #40: the fake world has one connected 'drive' server with 2 tools; the check is harbor_mcp, never a tool call against the server"
- id: harbor_can_i_talk
  prompt: "can i talk to you"
  expect: [{tool: harbor_capabilities}]
  forbid: [web_search, run_shell, toggle_setting]
  answer:
    contains_any: ["⌥⇧Space", "Option-Shift-Space", "mic", "microphone"]
    not_contains: ["Siri", "Hey Siri"]
  trap: "features #41 / dev8 814c0c0b: voice is ⌥⇧Space or the mic in Ask, and Harbor is never Siri (the how-to entry's regex even lists 'siri' as a keyword)"
- id: harbor_how_to_use
  prompt: "how do i use harbor"
  expect: [{tool: harbor_capabilities}]
  forbid: [web_search, run_shell]
  answer:
    contains_any: ["⌥Space", "Option-Space", "notch"]
    not_contains: ["Siri", "<|tool_call"]
  trap: "features #41: topic=howto; the guide opens with the ⌥Space shortcut and the notch"
- id: harbor_connect_gmail
  prompt: "how do i connect my gmail"
  expect: [{tool: harbor_capabilities}]
  forbid: [web_search, web_fetch, run_shell, open_app]
  answer:
    contains_any: ["Settings", "Mail app", "Apple"]
    not_contains: ["Siri", "<|tool_call"]
  trap: "features #41 / dev8 d69f3c5f, 8240bb2d: the Google steps depend on the build (Settings → Google, or 'this version can't sign in; if your Gmail is in Apple's Mail I read it there'); either is right, a web search is not"
- id: harbor_email_how_far_back
  report_only: "the purpose-built coverage tool has no fake in the test world, so the right path cannot run; a data-tool path is the wrong one"
  prompt: "from how far back can you check emails"
  expect: [{any_of: [harbor_capabilities, harbor_status, view_emails, summarize_emails]}]
  forbid: [run_shell, web_search]
  answer:
    contains_any: [recent, days, weeks, months, "50"]
    not_contains: ["Siri", "<|tool_call"]
  trap: "real-usage 1E #67 (3 real turns, outcome not visible): an honest answer states the recent-mail window instead of promising everything or refusing"
- id: harbor_can_you_send_texts
  prompt: "can you send texts?"
  forbid: [send_message, send_email, schedule_send, draft_message]
  answer:
    contains_any: ["confirm", "approve", "show you", "ask you", "before sending", "before i send", "before it's sent", "before anything is sent"]
    not_contains: ["Siri", "<|tool_call", "can't send texts", "cannot send texts", "can't send messages", "cannot send messages"]
  trap: "features #40: a capability question is answered (harbor_capabilities(query) or from the system prompt) and sends nothing; the answer says every send is shown to the user first"
- id: harbor_what_do_you_know_about_me
  prompt: "what do u know about me"
  expect: [{any_of: [recall, describe_me]}]
  forbid: [web_search, harbor_capabilities]
  answer:
    contains_any: ["{employer}", "{preferred_name}", "{isp}", "{user_birthday}", penicillin]
    not_contains: ["Siri"]
  trap: "dev8 a1731a57: 'what do you know about me' is a memory question, not a capability question; harbor_capabilities as the whole answer is the old failure"
