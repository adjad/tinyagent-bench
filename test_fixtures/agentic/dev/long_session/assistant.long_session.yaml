      - id: m-f02
        from: Fiona Kowalski <fiona.kowalski@example.org>
        subject: Plans for the quarterly figures
        body: We're splitting into two groups after the break. The sign-up sheet is pinned by the kitchen door.
          The hall has step-free access from the car park. Parking is free after six in the side car park. The fire
          exit is through the back corridor. The caterers need final numbers by Wednesday lunchtime. The projector
          in room two is working again. Let me know if your plans change before then. Thanks again for helping out
          last week. The front door code has not changed. Cash or card is fine for the deposit. The meeting room
          is booked for the whole afternoon. I've attached the latest version of the schedule. We'll share photos
          in the group chat afterwards. We still need two more volunteers. Signs will point the way from the bus
          stop. There's a spare set of keys at reception. Children are welcome, and there's a quiet corner for them.
          Leftover food goes to the shelter afterwards. The minibus leaves from outside the library. There will
          be tea and biscuits at the break. I've copied in everyone who signed up. If you're driving, the main gate
          opens at half past eight. I'll send the minutes round once they're typed up. Last time we ran over, so
          we'll keep a closer eye on the clock. The cloakroom is on the left as you come in. Bring the receipts
          so we can settle up. Do bring a friend if they're interested. We moved the start a little later to suit
          everyone. Please bring a packed lunch if you can.
        received: -30h
        unread: true
      - id: m-f03
        from: Yusuf Pemberton <yusuf.pemberton@example.org>
        subject: Plans for the team lunch
        body: I've attached the latest version of the schedule. We'll do a quick round of introductions first. The
          projector in room two is working again. Let me know if your plans change before then. I've copied in everyone
          who signed up. Do bring a friend if they're interested. Signs will point the way from the bus stop. Children
          are welcome, and there's a quiet corner for them. I'll send the minutes round once they're typed up. The
