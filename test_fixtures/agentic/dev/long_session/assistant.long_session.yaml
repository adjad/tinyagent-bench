      mail:
      - id: m-te
        from: Pavel Oyelaran <pavel.oyelaran@example.org>
        subject: Viewing at Willow Street Clinic
        body: The viewing at Willow Street Clinic is on Thursday at {e_th}:15. Thanks again for helping out last
          week. The minibus leaves from outside the library.
        received: -3h
        unread: true
      - id: m-f02
        from: Delphine Jessup <delphine.jessup@example.org>
        subject: Plans for the venue booking
        body: We'll share photos in the group chat afterwards. If you're driving, the main gate opens at half past
          eight. Wear something warm, the hall gets cold. The minibus leaves from outside the library. We still
          need two more volunteers. Parking is free after six in the side car park. Cash or card is fine for the
          deposit. We'll do a quick round of introductions first. Please reply to me rather than the whole list.
          Children are welcome, and there's a quiet corner for them. Last time we ran over, so we'll keep a closer
          eye on the clock. Signs will point the way from the bus stop. I'll send the minutes round once they're
          typed up. We moved the start a little later to suit everyone. The fire exit is through the back corridor.
          The front door code has not changed. We're splitting into two groups after the break. I've attached the
          latest version of the schedule. The cloakroom is on the left as you come in. There will be tea and biscuits
          at the break. The projector in room two is working again. The forecast looks dry, so we'll stay outside.
          There's a spare set of keys at reception. The caterers need final numbers by Wednesday lunchtime. Let
          me know if your plans change before then. Leftover food goes to the shelter afterwards. The meeting room
          is booked for the whole afternoon. Please bring a packed lunch if you can. The hall has step-free access
          from the car park. Do bring a friend if they're interested.
        received: -30h
        unread: true
