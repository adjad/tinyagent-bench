          be tea and biscuits at the break. Please reply to me rather than the whole list. The hall has step-free
          access from the car park. Let me know if your plans change before then. Children are welcome, and there's
          a quiet corner for them. Thanks again for helping out last week. The meeting room is booked for the whole
          afternoon. The caterers need final numbers by Wednesday lunchtime. Wear something warm, the hall gets
          cold. The sign-up sheet is pinned by the kitchen door. The front door code has not changed. The fire exit
          is through the back corridor. We're splitting into two groups after the break. There's a spare set of
          keys at reception.
