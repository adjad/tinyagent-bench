      - id: m-te
        from: Ximena Kerrigan <ximena.kerrigan@example.org>
        subject: Viewing at Juniper Hall
        body: The viewing at Juniper Hall is on Thursday at {e_th}:15. We're splitting into two groups after the
          break. Parking is free after six in the side car park.
        received: -3h
        unread: true
      - id: m-f02
        from: Joaquin Galloway <joaquin.galloway@example.org>
        subject: Plans for the venue booking
        body: There's a spare set of keys at reception. We're splitting into two groups after the break. The minibus
          leaves from outside the library. The cloakroom is on the left as you come in. I'll send the minutes round
          once they're typed up. There will be tea and biscuits at the break. Please reply to me rather than the
          whole list. We'll do a quick round of introductions first. I've attached the latest version of the schedule.
          The front door code has not changed. The hall has step-free access from the car park. Cash or card is
          fine for the deposit. The forecast looks dry, so we'll stay outside. Bring the receipts so we can settle
          up. The projector in room two is working again. We still need two more volunteers. Wear something warm,
          the hall gets cold. Thanks again for helping out last week. The caterers need final numbers by Wednesday
          lunchtime. Children are welcome, and there's a quiet corner for them. If you're driving, the main gate
          opens at half past eight. The fire exit is through the back corridor. Do bring a friend if they're interested.
          We'll share photos in the group chat afterwards. Signs will point the way from the bus stop. Last time
          we ran over, so we'll keep a closer eye on the clock. Parking is free after six in the side car park.
          I've copied in everyone who signed up. Please bring a packed lunch if you can. The meeting room is booked
          for the whole afternoon.
        received: -30h
        unread: true
