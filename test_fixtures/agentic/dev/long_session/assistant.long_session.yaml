      - id: m-f02
        from: Ingrid Varga <ingrid.varga@example.org>
        subject: Plans for the training day
        body: The caterers need final numbers by Wednesday lunchtime. We moved the start a little later to suit
          everyone. The fire exit is through the back corridor. The sign-up sheet is pinned by the kitchen door.
          Bring the receipts so we can settle up. Signs will point the way from the bus stop. The projector in room
          two is working again. I'll send the minutes round once they're typed up. The cloakroom is on the left
          as you come in. The forecast looks dry, so we'll stay outside. Please reply to me rather than the whole
          list. Let me know if your plans change before then. Please bring a packed lunch if you can. We'll do a
          quick round of introductions first. The hall has step-free access from the car park. Children are welcome,
          and there's a quiet corner for them. Thanks again for helping out last week. Leftover food goes to the
          shelter afterwards. Do bring a friend if they're interested. Parking is free after six in the side car
          park. I've copied in everyone who signed up. If you're driving, the main gate opens at half past eight.
          There's a spare set of keys at reception. We'll share photos in the group chat afterwards. The meeting
          room is booked for the whole afternoon. Cash or card is fine for the deposit. The minibus leaves from
          outside the library. Last time we ran over, so we'll keep a closer eye on the clock. I've attached the
          latest version of the schedule. The front door code has not changed.
        received: -30h
        unread: true
