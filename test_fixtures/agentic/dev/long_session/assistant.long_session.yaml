      - id: m-f02
        from: Hana Dunmore <hana.dunmore@example.org>
        subject: Plans for next week's rota
        body: The projector in room two is working again. The hall has step-free access from the car park. The minibus
          leaves from outside the library. Last time we ran over, so we'll keep a closer eye on the clock. Children
          are welcome, and there's a quiet corner for them. Please bring a packed lunch if you can. The sign-up
          sheet is pinned by the kitchen door. We'll do a quick round of introductions first. Please reply to me
          rather than the whole list. We'll share photos in the group chat afterwards. Let me know if your plans
          change before then. Thanks again for helping out last week. Bring the receipts so we can settle up. Signs
          will point the way from the bus stop. The forecast looks dry, so we'll stay outside. We still need two
          more volunteers. The meeting room is booked for the whole afternoon. The fire exit is through the back
          corridor. Parking is free after six in the side car park. I'll send the minutes round once they're typed
          up. Do bring a friend if they're interested. We're splitting into two groups after the break. The front
          door code has not changed. We moved the start a little later to suit everyone. I've attached the latest
          version of the schedule. Leftover food goes to the shelter afterwards. The caterers need final numbers
          by Wednesday lunchtime. There will be tea and biscuits at the break. Wear something warm, the hall gets
          cold. If you're driving, the main gate opens at half past eight.
        received: -30h
        unread: true
