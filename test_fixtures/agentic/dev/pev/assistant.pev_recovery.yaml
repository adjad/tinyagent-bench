  tags:
  - wrong_result
  - partial
  prompt: remind me to water the tomatoes tomorrow at {p}pm
  facts:
    p:
      int:
      - 1
      - 4
    h24:
      add:
      - p
      - 12
    w:
      add:
      - p
      - 1
    w24:
      add:
      - p
      - 13
  faults:
  - tool: add_reminder
    on_call: 1
    kind: partial
    applies_effect:
      when_iso: +1d {w24}:00
    text: 'Reminder set: “Water the tomatoes” — {tomorrow_weekday} at {w}:00 PM in Apple Reminders and Harbor.'
  expect:
  - tool: add_reminder
    args:
      title:
        icontains: tomatoes
  - tool: update_reminder
  final_state:
  - in: reminders
    where:
      title:
        icontains: tomatoes
    expect:
      count: 1
      due: +1d {h24}:00
  claims:
  - success_claim: \b(moved|rescheduled|changed|updated|set|now|added|booked|turned)\b(?:(?!\b(?:instead|not|but|rather|asked|wanted|meant)\b)[^.?!;]){0,40}?\b(to|at|for)
      {p}(:00)?\s*(pm|p\.m\.)
    state:
      in: reminders
      where:
        title:
          icontains: tomatoes
      expect:
        count: 1
        due: +1d {h24}:00
  alt_pass:
  - final_state:
    - in: reminders
      where:
        title:
          icontains: tomatoes
      expect:
        count: 1
        due: +1d {w24}:00
    answer:
      contains_any:
      - '{w}:00'
      - '{w} pm'
      - '{w}pm'
      - '{w24}:00'
      - '{w} p.m.'
      regex: \b(instead|wrong|not {p}|rather than|asked for|wanted|meant|mismatch|but)\b
  unchanged:
  - calendar
  - messages_sent
  - mail_sent
  max_calls: 4
  optimal:
    calls: 2
    steps: 3
  oracle:
  - calls:
    - name: add_reminder
      arguments:
        title: Water the tomatoes
        when_iso: +1d {h24}:00
  - calls:
    - name: update_reminder
      arguments:
        title: Water the tomatoes
        when_iso: +1d {h24}:00
  - text: 'It first saved at {w} PM instead of {p} PM, so I corrected it: the reminder to water the tomatoes is
      now tomorrow at {p} PM.'
  trap: the receipt shows the wrong hour; adding again duplicates, update_reminder fixes it
  split: dev
