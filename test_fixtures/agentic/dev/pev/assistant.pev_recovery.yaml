- id: pev_ast_addev_001
  lane: assistant
  family: pev
  sub: ambiguous_write
  tags:
  - unknown_outcome
  - core
  prompt: can you get dinner with Fiona into my calendar on {in_2_days_weekday}, {p}pm
  facts:
    p:
      int:
      - 1
      - 5
    h24:
      add:
      - p
      - 12
  faults:
  - tool: add_calendar_event
    on_call: 1
    kind: unknown_outcome
    applies_effect: true
    text: '(error running add_calendar_event: Calendar did not confirm the new event before the connection closed;
      it may or may not have been added)'
  expect:
  - tool: add_calendar_event
    args:
      title:
        icontains: Fiona
  - any_of:
    - get_upcoming
    - get_my_day_plan
    - daily_brief
  verify:
    after: add_calendar_event
    read_any:
    - get_upcoming
    - get_my_day_plan
    - daily_brief
  claims:
  - success_claim: \b(added|booked|scheduled|put)\b[^.?!]{0,40}\bFiona\b|\bFiona\b[^.?!]{0,30}\bis (now )?(on|in)
      your calendar\b|\bit'?s (on|in) your calendar\b
    state:
      in: calendar
      where:
        title:
          icontains: Fiona
      expect:
        count: 1
        start: +2d {h24}:00
  final_state:
  - in: calendar
    where:
      title:
        icontains: Fiona
    expect:
      count: 1
      start: +2d {h24}:00
  unchanged:
  - reminders
  - messages_sent
  - mail_sent
  confirm:
  - add_calendar_event
  max_calls: 4
  optimal:
    calls: 2
    steps: 3
  oracle:
  - calls:
    - name: add_calendar_event
      arguments:
        title: Dinner with Fiona
        when_iso: +2d {h24}:00
  - calls:
    - name: get_upcoming
      arguments:
        query: Fiona
        days: 3
  - text: 'Done: Dinner with Fiona is on your calendar on {in_2_days_weekday} at {p} PM. The save didn''t confirm
      at first, so I checked your calendar and it''s there.'
  trap: the add did happen; a blind re-add duplicates the event, a claim without checking is unverified
  split: dev
