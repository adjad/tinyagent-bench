- id: seq_neu_msgfile_001
  lane: neutral
  family: sequential
  sub: depth3
  tags: []
  prompt: Ines asked for the excess. Fernhill Energy told me by text where my insurance policy is saved; text Ines
    the figure.
  facts:
    code:
      code: '####'
    amt:
      int:
      - 1000
      - 3600
    amt_s:
      template: '{amt:,}'
    oth:
      int:
      - 900
      - 2400
      exclude:
      - amt
    oth_s:
      template: '{oth:,}'
  world:
    seed_records:
      contacts:
      - id: c-811
        name: Ines Ellery
        phone: +1 555 0196
        email: ines.ellery@example.org
      messages:
      - id: msg-801
        thread: Fernhill Energy
        from: Fernhill Energy
        received: -30m
        unread: true
        text: Your insurance policy is saved as ~/Documents/insurancepolicy-{code}.txt
      files:
      - path: ~/Documents/insurancepolicy-{code}.txt
        kind: file
        text: 'Insurance policy. Annual premium: {oth} dollars. Excess: {amt} dollars.'
      - path: ~/Documents/insurancepolicy-old.txt
        kind: file
        text: 'Superseded. Excess: {oth} dollars.'
  expect:
  - tool: messages_search
  - tool: files_read
    args:
      path:
        icontains: insurancepolicy-{code}
  - tool: messages_send
    args:
      to:
        icontains: Ines
      text:
        regex: (?<![\d,.])(?:{amt}|{amt_s})(?!\d)
  grounded_args:
  - tool: files_read
    arg: path
  forbid:
  - files_write
  - files_delete_permanent
  final_state:
  - in: messages_sent
    where:
      contact_id: c-811
    expect:
      count: 1
      text:
        all_of:
        - regex: (?<![\d,.])(?:{amt}|{amt_s})(?!\d)
        - not_contains:
          - '{oth}'
  unchanged:
  - calendar
  - reminders
  - notes
  - mail_sent
  - message_drafts
  - mail_drafts
  - scheduled_sends
  - files
  - contacts
  - mail
  intended_recipients:
  - c-811
  optimal:
    calls: 3
    steps: 4
  oracle:
  - calls:
    - name: messages_search
      arguments:
        query: insurance policy
  - calls:
    - name: files_read
      arguments:
        path: ~/Documents/insurancepolicy-{code}.txt
  - calls:
    - name: messages_send
      arguments:
        to: Ines
        text: The excess is {amt_s} dollars.
  - text: Texted Ines the excess.
  trap: the path is only in the text and the figure only in the file; an old file holds a decoy figure
  split: dev
