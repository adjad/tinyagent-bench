  - screenshot_som
  start:
    app: browser
    url: clinic.example/request
  world:
    apps:
    - messages
    - calendar
    - browser
    generator: cross_setup
    params:
      setup:
      - clinic_align
      - browser_open
      - clinic_prefill
      browser_url: clinic.example/request
      messages:
        with_code:
          kind: booking
      day: Monday
      time_of_day: Morning
      reason: General check-up
    noise:
      unnamed_icons: 0.1
      nested_groups: true
  task: The clinic texted me a booking code. Put it into the clinic form I left open in the Browser and send the
    request (go ahead, no need to check). After that, block out next Monday 09:00-10:00 in my calendar as "Clinic".
  final_state:
  - in: clinic.requests
    where:
      code: '{code}'
    expect:
      count: 1
      name:
        icontains: '{patient_name}'
      day: Monday
      time_of_day: Morning
  - in: calendar.events
    where:
      title:
        icontains: clinic
    expect:
      count: 1
      date: '{next_monday}'
      start: 09:00
      end: '10:00'
  preauthorised: true
  actionable: true
  allowed_effects:
