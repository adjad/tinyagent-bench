  split: dev
  optimal:
    steps: 8
  max_steps: 16
  core: false
- id: scr_cross_list_mail_update_reminder_l5_028
  spec: screen
  family: cross
  level: 5
  tracks:
  - ax_text
  start:
    app: notes
  world:
    apps:
    - notes
    - mail
    - messages
    - calendar
    generator: cross_setup
    params:
      setup:
      - notes_groceries_short
      disrupt:
      - kind: update_reminder
        app: mail
        when:
          on_front: mail
    noise:
      unnamed_icons: 0.1
      nested_groups: true
  task: '{latest_sender} is doing the shopping today. Email them what''s left on my Groceries list (skip anything
    already ticked), subject "Shopping list".'
  final_state:
  - in: mail.sent
    expect:
      count: 1
  - in: mail.sent
    where:
      to:
        icontains: '{latest_email}'
    expect:
      subject:
        icontains: shopping list
      body:
        icontains: '{g_open1}'
  - in: mail.sent
    expect:
      body:
        icontains: '{g_open2}'
  - in: mail.sent
    expect:
      body:
        icontains: '{g_open3}'
  - in: mail.sent
    expect:
      body:
        not_icontains: '{g_done1}'
  - in: mail.sent
    expect:
      body:
        not_icontains: '{g_done2}'
  preauthorised: false
  actionable: true
  needs_ask: true
  confirm_regex: \b(send|sending|email|mail)\b
  user_replies:
  - when: confirm
    reply: Yes, send it.
    grants: true
  allowed_effects:
  - mail.compose.send
  tags:
  - cross
  - list_mail_update_reminder
  - update_reminder
  oracle:
  - click: notes.lists.row.l1
  - click: dock.mail
  - click: dlg.update.mail.later
  - click: mail.list.compose
  - type: mail.compose.to
    text: '{latest_email}'
  - type: mail.compose.subject
    text: Shopping list
  - type: mail.compose.body
    text: '{g_open1}, {g_open2}, {g_open3}'
  - ask: Ready to send "Shopping list" to {latest_sender} with {g_open1}, {g_open2} and {g_open3}. Send it?
  - click: mail.compose.send
  - finish: true
  unchanged:
  - notes
  - mail.inbox
  - mail.drafts
  template: list_mail_update_reminder
  split: dev
  optimal:
    steps: 10
  max_steps: 20
  core: false
- id: scr_cross_invite_event_text_l5_029
  spec: screen
  family: cross
  level: 5
  tracks:
  - ax_text
  - screenshot_som
  - ax_plus_screenshot
  start:
    app: mail
  world:
    apps:
    - mail
    - messages
    - calendar
    generator: cross_setup
    params:
      setup:
      - invite_end
      hours: 2
    noise:
      unnamed_icons: 0.1
      nested_groups: true
  task: Add the {invite_topic} from {invite_sender}'s email to my calendar (date and time from the email, two hours
    long), then text {plan_contact} that I'm going to the {invite_topic} on {invite_weekday}. Send the text, no
    need to check.
  final_state:
  - in: calendar.events
    where:
      title:
        icontains: '{invite_topic}'
      date: '{invite_date}'
      start: '{invite_time}'
    expect:
      count: 1
      end: '{invite_end}'
  - in: messages.sent
    expect:
      count: 1
  - in: messages.sent
    where:
      thread: '{plan_thread_id}'
    expect:
      text:
        icontains: '{invite_topic}'
  - in: messages.sent
    expect:
      text:
        icontains: '{invite_weekday}'
  preauthorised: true
  actionable: true
  allowed_effects:
  - messages.thread.reply
  - messages.thread.send
  oracle:
  - click: mail.list.msg.{invite_id}
  - click: dock.calendar
  - click: calendar.day.new
  - type: calendar.sheet.title
    text: '{invite_topic}'
  - type: calendar.sheet.date
    text: '{invite_date}'
  - select: calendar.sheet.start
    option: '{invite_time}'
  - select: calendar.sheet.end
    option: '{invite_end}'
  - click: calendar.sheet.add
  - click: dock.messages
  - click: messages.threads.thread.{plan_thread_id}
  - type: messages.thread.reply
    text: I'm going to the {invite_topic} on {invite_weekday}.
    submit: true
  - finish: true
  unchanged:
  - mail
  template: invite_event_text
  tags:
  - cross
  - invite_event_text
  split: dev
  optimal:
    steps: 12
  max_steps: 24
  core: false
