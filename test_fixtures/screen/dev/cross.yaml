  - click: messages.threads.thread.{code_thread_id}
  - click: dock.browser
  - type: clinic.request.code
    text: '{code}'
  - click: clinic.request.send
  - click: dock.calendar
  - click: calendar.day.new
  - type: calendar.sheet.title
    text: Clinic
  - type: calendar.sheet.date
    text: '{next_monday}'
  - click: calendar.sheet.add
  - finish: true
  unchanged:
  - messages
  template: code_clinic_calendar
  tags:
  - code_clinic_calendar
  - cross
  split: dev
  optimal:
    steps: 11
  max_steps: 22
  core: true
- id: scr_cross_file_note_permission_l5_027
