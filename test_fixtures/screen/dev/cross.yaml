        icontains: '{dl_name}'
    expect:
      count: 1
      done: false
  - in: notes.lists.{x_list_idx}.items
    expect:
      count: 3
  - in: files.items
    where:
      id: '{dl_id}'
    expect:
      count: 1
      folder: Desktop
      name: '{dl_name}'
