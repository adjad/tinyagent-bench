- id: scr_disrupt_two_calendar_update_reminder_l4_033
  spec: screen
  family: disrupt
  level: 4
  tracks:
  - ax_text
  start:
    app: calendar
  world:
    apps:
    - calendar
    - notes
    - mail
    generator: disrupt_surprise
    params:
      setup:
      - calendar_pick
      disrupt:
      - kind: banner
        app: calendar
        key: banner/layout
        title: Storage almost full
        text: Your disk is almost full. You can free up space in Settings.
        when:
          on_key: calendar/sheet/end
      - kind: relabel
        key: calendar/sheet/save
        name: Save changes
        when:
          on_key: calendar/sheet/end
      - kind: update_reminder
        app: calendar
        when:
          on_key: calendar/event/edit
        version: '3.2'
    noise:
      unnamed_icons: 0.1
      nested_groups: true
  task: Reschedule tomorrow's {ev_title} so it runs from {ev_new_start} to {ev_new_end}. Only tomorrow's one.
  final_state:
  - in: calendar.events
    where:
      id: '{ev_id}'
    expect:
      count: 1
      date: '{tomorrow}'
      start: '{ev_new_start}'
      end: '{ev_new_end}'
  - in: calendar.events
    where:
      id: '{distractor_id}'
    expect:
      count: 1
      date: '{distractor_date}'
      start: '{distractor_time}'
  actionable: true
  tags:
  - disrupt
  - layout
  - two_calendar_update_reminder
  - update_reminder
  oracle:
  - click: calendar.day.next
  - click: calendar.day.event.{ev_id}
  - click: calendar.event.edit
  - click: dlg.update.calendar.later
  - select: calendar.sheet.start
    option: '{ev_new_start}'
  - select: calendar.sheet.end
    option: '{ev_new_end}'
  - click: calendar.sheet.save
  - finish: true
  template: two_calendar_update_reminder
  split: dev
  optimal:
    steps: 8
  max_steps: 16
  core: false
